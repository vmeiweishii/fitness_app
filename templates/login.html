<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Фитнес-центр</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6D83F2;
            --primary-light: #8EA4FF;
            --accent-color: #FF7B9C;
            --background: #F9F7FE;
            --card-bg: #FFFFFF;
        }
        
        body {
            background-color: var(--background);
            font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .login-container {
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }
        
        .login-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px rgba(109, 131, 242, 0.1);
            border: 1px solid rgba(109, 131, 242, 0.1);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo-icon {
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        .logo h1 {
            color: var(--primary-color);
            font-weight: 600;
            font-size: 1.8rem;
            margin: 0;
        }
        
        .logo p {
            color: #666;
            font-size: 0.9rem;
        }
        
        .form-control {
            border: 2px solid #E6E9FF;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(109, 131, 242, 0.1);
        }
        
        .btn-login {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
            transition: transform 0.2s;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            color: white;
        }
        
        .footer-links {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.9rem;
        }
        
        .alert {
            border-radius: 10px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="login-card">
                <div class="logo">
                    <div class="logo-icon">🏋️</div>
                    <h1>Фитнес-центр</h1>
                    <p>Система управления</p>
                </div>
                
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="alert alert-warning alert-dismissible fade show" role="alert">
                            {{ messages[0] }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endif %}
                {% endwith %}
                
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label">Логин:</label>
                        <input type="text" name="username" class="form-control" 
                               placeholder="Введите логин" required autofocus>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label">Пароль:</label>
                        <input type="password" name="password" class="form-control" 
                               placeholder="Введите пароль" required>
                    </div>
                    
                    <button type="submit" class="btn-login mb-3">Войти в систему</button>
                </form>
                
                <div class="footer-links">
                    <p class="mb-2">
                        Нет аккаунта? 
                        <a href="{{ url_for('register') }}" class="text-decoration-none" style="color: var(--primary-color);">
                            Зарегистрироваться
                        </a>
                    </p>
                    <a href="/test_db" class="text-decoration-none" style="color: #666;">
                        Проверка подключения к БД
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
