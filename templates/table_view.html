<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ table_name_ru }} | Фитнес-центр</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">🏋️ Фитнес-центр</a>
            <div class="text-white">
                {{ username }} ({{ user_role|replace('_', ' ')|title }})
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>{{ table_name_ru }}</h2>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Назад</a>
        </div>
        
        <div class="table-responsive">
            {{ table_html|safe }}
        </div>
        
        <div class="mt-3 text-muted small">
            Показано до 50 записей. Режим только для чтения.
        </div>
    </div>
</body>
</html>
